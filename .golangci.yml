version: "2"

run:
  modules-download-mode: readonly
  timeout: 2m

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - localmodule
      custom-order: true

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - copyloopvar
    - depguard
    - dupl
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - gochecknoglobals
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - lll
    - mirror
    - misspell
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unused
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [dupl, errcheck, gocognit, gosec, noctx]
      - path: internal/adapter/httpcheck/
        linters: [gosec]
        text: G404
  settings:
    depguard:
      rules:
        service:
          files: ["**/internal/service/**"]
          deny:
            - pkg: github.com/iamroockie/pulsewatch/internal/adapter
              desc: service declares ports, adapters implement them
            - pkg: github.com/iamroockie/pulsewatch/internal/transport
              desc: service does not know how it is called
            - pkg: github.com/iamroockie/pulsewatch/internal/schedule
              desc: service does not know how it is called
            - pkg: github.com/iamroockie/pulsewatch/internal/pool
              desc: service does not know how it is called
            - pkg: github.com/iamroockie/pulsewatch/internal/observability
              desc: metrics wrap service ports from outside
            - pkg: github.com/prometheus
              desc: metrics wrap service ports from outside
        adapter:
          files: ["**/internal/adapter/**"]
          deny:
            - pkg: github.com/iamroockie/pulsewatch/internal/service
              desc: adapters implement ports without importing them
            - pkg: github.com/iamroockie/pulsewatch/internal/transport
              desc: outgoing side never depends on incoming HTTP
            - pkg: github.com/iamroockie/pulsewatch/internal/schedule
              desc: adapters are leaves
            - pkg: github.com/iamroockie/pulsewatch/internal/pool
              desc: adapters are leaves
        transport:
          files: ["**/internal/transport/**"]
          deny:
            - pkg: github.com/iamroockie/pulsewatch/internal/adapter
              desc: transport goes through service
            - pkg: github.com/iamroockie/pulsewatch/internal/schedule
              desc: API and background pipeline meet only in service
            - pkg: github.com/iamroockie/pulsewatch/internal/pool
              desc: API and background pipeline meet only in service
        background:
          files: ["**/internal/schedule/**", "**/internal/pool/**"]
          deny:
            - pkg: github.com/iamroockie/pulsewatch/internal/transport
              desc: API and background pipeline meet only in service
            - pkg: github.com/iamroockie/pulsewatch/internal/adapter
              desc: background pipeline goes through service
            - pkg: github.com/iamroockie/pulsewatch/internal/observability
              desc: metrics wrap background ports from outside
            - pkg: github.com/prometheus
              desc: metrics wrap background ports from outside
        observability:
          files: ["**/internal/observability/**"]
          deny:
            - pkg: github.com/iamroockie/pulsewatch/internal/service
              desc: wrappers declare the ports they wrap
            - pkg: github.com/iamroockie/pulsewatch/internal/adapter
              desc: wrappers declare the ports they wrap
            - pkg: github.com/iamroockie/pulsewatch/internal/transport
              desc: wrappers declare the ports they wrap
            - pkg: github.com/iamroockie/pulsewatch/internal/schedule
              desc: wrappers declare the ports they wrap
            - pkg: github.com/iamroockie/pulsewatch/internal/pool
              desc: wrappers declare the ports they wrap
    embeddedstructfieldcheck:
      forbid-mutex: true
    gocognit:
      min-complexity: 15
    lll:
      tab-width: 4
      line-length: 100
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    testifylint:
      enable-all: true
