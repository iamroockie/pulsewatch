services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    ports:
      - ${PG_PORT}:5432
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER}", "-d", "${PG_NAME}"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  redis:
    image: redis:8.10.2-trixie
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    ports:
      - ${REDIS_PORT}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  prometheus:
    image: prom/prometheus:v3.15.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  grafana:
    image: grafana/grafana:13.2.3
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 500ms

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
