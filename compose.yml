services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    ports:
      - ${PG_PORT}:5432
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER}", "-d", "${PG_NAME}"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  redis:
    image: redis:8.10.2-trixie
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    ports:
      - ${REDIS_PORT}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

volumes:
  pg_data:
