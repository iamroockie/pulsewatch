services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    ports:
      - ${PG_PORT}:5432
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${PG_USER}", "-d", "${PG_NAME}"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  redis:
    image: redis:8.10.2-trixie
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    ports:
      - ${REDIS_PORT}:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: >-
        user=${PG_USER} password=${PG_PASS} host=postgres port=5432
        dbname=${PG_NAME} sslmode=${PG_SSL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      PG_HOST: postgres
      PG_PORT: 5432
    ports:
      - 127.0.0.1:${HTTP_PORT}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9101
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9101/metrics"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 500ms

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
